name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET: ci-secret
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q app
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - name: Smoke test (app boots, /health responds)
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app
          r = TestClient(app).get("/health")
          assert r.status_code == 200 and r.json()["status"] == "healthy", r.text
          print("ok")
          EOF
      - name: Run tests (if any)
        run: |
          if ls tests >/dev/null 2>&1; then pytest -q; else echo "no tests yet"; fi
      - name: Docker build
        working-directory: .
        run: docker build -t adcreative-backend:ci backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Type check (informational; next.config ignores TS errors)
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
      - name: Docker build
        working-directory: .
        run: docker build -t adcreative-frontend:ci frontend

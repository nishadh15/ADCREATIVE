services:
  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env          # GROQ_API_KEYS, META_*, JWT_SECRET, ADMIN_*
    environment:
      MONGODB_URI: mongodb://mongo:27017    # overrides .env; remove to use Atlas from .env instead
      FRONTEND_URL: http://localhost:3000
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # URL the *browser* uses to reach the backend
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongodata:

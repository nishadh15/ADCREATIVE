services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adcreative
      POSTGRES_PASSWORD: adcreative
      POSTGRES_DB: adcreative
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adcreative"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env          # GROQ_API_KEYS, META_*, JWT_SECRET, ADMIN_*
    environment:
      DATABASE_URL: postgresql+psycopg://adcreative:adcreative@db:5432/adcreative
      FRONTEND_URL: http://localhost:3000
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # URL the *browser* uses to reach the backend
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
